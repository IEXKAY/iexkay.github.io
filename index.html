<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESKAY</title>
    <meta name="description" content="Perfil oficial de ESKAY (#iexkay). Redes sociales y proyectos en la nube.">

    <!-- Preconexiones y DNS Prefetch para máxima velocidad de carga -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">

    <!-- Favicon e iconos de pestaña y pantalla de inicio -->
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="favicon-192x192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="manifest" href="site.webmanifest">
    <meta name="theme-color" content="#0b0f19">

    <!-- Fuentes de Google: Outfit e Inter con swap para carga rápida -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Fondos de brillo optimizados -->
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <main class="profile-container">
        <div class="profile-card">
            <header class="profile-header">
                <div class="avatar-container">
                    <div class="avatar">
                        <img src="imagen.jpg" alt="Foto de perfil de ESKAY" width="150" height="150" loading="eager" fetchpriority="high">
                    </div>
                    <div class="status-badge" title="En línea">
                        <span class="status-dot"></span>
                    </div>
                </div>

                <div class="profile-info">
                    <h1 class="username-container">
                        <span class="username">ESKAY</span>
                        <span class="discriminator">#iexkay</span>
                    </h1>
                    <div class="status-text">
                        <i class="fa-solid fa-circle-play status-icon"></i>
                        <span>En línea</span>
                    </div>

                    <div class="social-links">
                        <a href="https://discord.gg/YrUz5fHPSd" target="_blank" rel="noopener noreferrer" class="social-icon discord"
                            title="Discord" id="social-discord">
                            <i class="fab fa-discord"></i>
                        </a>
                        <a href="https://www.instagram.com/iexkay/" target="_blank" rel="noopener noreferrer" class="social-icon instagram"
                            title="Instagram" id="social-instagram">
                            <i class="fab fa-instagram"></i>
                        </a>
                        <a href="https://github.com/IEXKAY" target="_blank" rel="noopener noreferrer" class="social-icon github" title="GitHub"
                            id="social-github">
                            <i class="fab fa-github"></i>
                        </a>
                        <a href="https://iexkay.github.io/repox/" target="_blank" rel="noopener noreferrer" class="social-icon cloud"
                            title="REPOX Cloud" id="social-repox">
                            <i class="fa-solid fa-cloud"></i>
                        </a>
                    </div>
                </div>
            </header>

            <hr class="divider">

            <section class="section">
                <h2 class="section-title">REPOX</h2>
                <div class="project-box">
                    <p class="project-description">Explora mi proyecto principal en la nube. Accede a herramientas web y
                        utilidades desde un solo lugar.</p>
                    <a href="https://iexkay.github.io/repox/" class="project-link" id="project-repox-btn">
                        <i class="fa-solid fa-cloud-arrow-up"></i>
                        <span>Ir a REPOX</span>
                    </a>
                </div>
            </section>
        </div>
    </main>
</body>

</html>
